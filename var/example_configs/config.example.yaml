# DAG Runner 启动配置示例。
# 复制到 var/config.yaml 后使用（dagrunner.server 默认读取 var/config.yaml）：
#   python -m dagrunner.server --config var/config.yaml
host: 127.0.0.1
port: 7119
# 默认 SQLite。写成 map 时可切换 MySQL 8：
# db:
#   type: mysql8
#   host: 127.0.0.1
#   port: 3306
#   user: dagrunner
#   password: ""
#   database: dagrunner
#   charset: utf8mb4
#   state_dir: var
db: var/scheduler.db
logs: var/logs
threads: 8
language: zh-CN
notifier_config: null
allow_insecure_remote_login: false

# 卫星版服务（主程序侧，HTTPS）。启用后监听独立端口，接收卫星版注册并下发任务。
# 三种网络拓扑：双向可达用反向模式；仅主程序能访问卫星用前向模式；
# 仅卫星能访问主程序用反向模式。卫星版会根据 mode 自动选择。
# 主程序与卫星版本必须完全相同（dagrunner.__version__），不一致时拒绝连接并断开。
satellite:
  enabled: false
  host: 0.0.0.0
  port: 7120
  threads: 16
  # 主程序侧证书（首次启动自动生成）
  cert: var/master-certs/cert.pem
  key: var/master-certs/key.pem
  # 卫星版回连主程序时使用的地址，会写进「下载配置」里的 master_url。
  # 留空则按 Web 请求的 Host + satellite.port 推导。
  # 例如用 nginx 反向代理 https://xxx.com:7117 -> 本机 7120，这里填 https://xxx.com:7117。
  # 注意 7120 是 HTTPS：nginx 需做 TLS 穿透或终止后重新加密，不能直接 HTTP 转发。
  public_url: ""
  timeout: 15
  poll_interval: 1.0
  # 下发更新时等待卫星下载、校验、暂存的最长秒数
  update_timeout: 300

# 版本更新。更新前会检查：没有运行中的任务；更新期间定时任务跳过；
# 主程序与在线卫星同时更新（离线卫星跳过，卫星也可单独更新）。
# 版本化安装目录：var/versions/<version>/，当前版本写在 var/current。
update:
  enabled: true
  # auto：优先 GitHub Release，其次 git；也可显式指定 git 或 release
  source: auto
  git:
    remote: origin
    # 目标 tag/分支；留空则按版本号找 vX.Y.Z 或 X.Y.Z
    branch_or_tag: ""
  release:
    repo: kbxu/DAG-Runner
    # 资产名模板；默认使用 dagrunner-<version>.tar.gz（跨平台）
    assets:
      windows: "dagrunner-{version}.tar.gz"
      linux: "dagrunner-{version}.tar.gz"
    # 可选：内网镜像地址模板，留空使用 GitHub
    download_url: ""
  rollback_on_failure: true
  # 分支模式（git clone / 开发部署）：网页选择「git 分支」后可检查 main 是否领先本地，
  # 确认后写交接请求，由看门狗执行 git pull --ff-only 并重启工作树。
  # 适用条件：运行目录本身是 git 仓库；发布包安装请继续用上面的 release/git tag 手动更新。
  branch:
    remote: origin
    name: main

# 运行记录归档。超过保留期的终态运行记录会移入 *_archive 表；后端服务不读这些表，仅供排查。
maintenance:
  enabled: true
  retention_days: 60
  # 每天低峰执行时间
  hour: 3
  minute: 15
  # 每批处理的运行数
  batch_size: 50

# 进程看门狗。服务崩溃或假死时自动重启；更新提交时接管版本切换与回滚。
# 启动脚本用 run_tee.py 拉起 python -m dagrunner.watchdog；enabled=false 时回退为直接运行服务。
watchdog:
  enabled: true
  mode: restart                 # restart | notify（只告警不重启）
  interval: 5                   # 健康检查间隔（秒）
  timeout: 3                    # 单次健康探测超时（秒）
  alert_after: 120              # 连续不健康 2 分钟：首次告警
  unhealthy_after: 300          # 连续不健康 5 分钟：判定假死并重启
  handoff_wait: 15              # 主动停止后等待更新交接请求的宽限（秒）
  backoff_base: 5               # 重启退避基数（秒）
  backoff_max: 300              # 重启退避上限（秒）
  stable_window: 300            # 稳定运行该时长后清零失败计数（秒）
  max_consecutive_failures: 0   # 0 = 永不放弃，按 backoff_max 持续重试
  stop_timeout: 20              # 停止子进程的宽限（秒），超时强杀进程树
  alert_to: []                  # 告警收件人；空 = 仅记录到 var/logs/watchdog.log
  alert_cooldown: 3600          # 重复重启告警的最小间隔（秒）
  health:
    require_scheduler: true     # 调度器未运行视为不健康
    require_db: true            # 数据库不可用视为不健康
