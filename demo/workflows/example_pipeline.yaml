name: example_pipeline
description: 示例数据处理流程
workdir: ..
env:
  DEMO_ENV: local
setup: |
  export PYTHONUNBUFFERED=1
schedule:
  cron: "0 9 * * mon-fri"
  timezone: Asia/Shanghai
  enabled: false

tasks:
  extract_data:
    description: 提取示例数据
    command: [python, tasks/extract.py]
    depends: []

  transform_data:
    description: 清洗转换数据
    command: [python, tasks/transform.py]
    depends: [extract_data]

  summarize_data:
    description: 汇总统计结果
    command: [python, tasks/summarize.py]
    depends: [transform_data]

  publish_report:
    description: 生成示例报告
    command: [python, tasks/publish.py]
    depends: [summarize_data]
