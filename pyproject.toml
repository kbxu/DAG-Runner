[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagrunner"
dynamic = ["version", "readme", "dependencies"]
description = "Lightweight, cross-platform Python DAG workflow runner"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DAG Runner" }]
keywords = ["dag", "workflow", "scheduler", "cron"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/kbxu/DAG-Runner"

[tool.setuptools]
py-modules = ["run_server", "run_satellite"]

[tool.setuptools.packages.find]
include = ["dagrunner*"]
namespaces = true

[tool.setuptools.package-data]
dagrunner = ["templates/*", "static/*"]

[tool.setuptools.dynamic]
version = { attr = "dagrunner.__version__" }
readme = { file = ["README.md"] }
dependencies = { file = ["requirements.txt"] }
