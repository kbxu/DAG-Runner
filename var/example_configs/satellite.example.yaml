# DAG Runner 卫星版配置示例。
# 复制到 var/satellite.yaml 后使用：
#   python -m dagrunner.satellite --config var/satellite.yaml
# token 由主程序 Web 控制台的“卫星”页面生成，下载配置时会自动填入。
# 主程序与卫星版本必须完全相同（dagrunner.__version__），不一致时拒绝连接并断开。
satellite:
  # 卫星节点别名，必须与主程序上配置的一致
  alias: sat-01
  # 主程序卫星服务地址（HTTPS）
  master_url: https://master.example.com:7120
  # 与主程序共享的令牌，留空可临时启动，但必须与主程序配置一致
  token: ""
  # auto：优先反向连接主程序，失败则监听前向连接
  # forward：仅监听，等待主程序连接（仅主程序能访问卫星端口）
  # reverse：仅主动连接主程序（仅卫星能访问主程序端口）
  mode: auto
  listen_host: 0.0.0.0
  listen_port: 7121
  # 卫星版自己的证书（首次启动自动生成，不要与主程序共用）
  # 迁移卫星时直接拷贝 var/satellite-certs/ 整个目录即可
  cert: var/satellite-certs/cert.pem
  key: var/satellite-certs/key.pem
  host_key_policy: accept-new
  # 固定主程序证书指纹（可选，64 位十六进制）；留空使用 accept-new
  master_cert_fingerprint: ""
  # 任务默认工作目录，留空使用进程当前目录
  workdir: ""
  log_dir: var/satellite-logs
  heartbeat_interval: 30
  probe_interval: 60
  timeout: 15
  # 主机下发更新时，证书信任策略同 host_key_policy；
  # 单独更新：python -m dagrunner.server.update --role satellite --to <version>

# 卫星进程看门狗。卫星代理崩溃或假死时自动重启；主机下发更新时接管版本切换。
watchdog:
  enabled: true
  mode: restart                 # restart | notify（只告警不重启）
  interval: 5
  timeout: 3
  alert_after: 120              # 连续不健康 2 分钟：首次告警
  unhealthy_after: 300          # 连续不健康 5 分钟：判定假死并重启
  handoff_wait: 15              # 主动停止后等待更新交接请求的宽限（秒）
  backoff_base: 5
  backoff_max: 300
  stable_window: 300
  max_consecutive_failures: 0
  stop_timeout: 20
  alert_to: []
  alert_cooldown: 3600
  health:
    require_db: true
    # require_scheduler 对卫星无意义，忽略
