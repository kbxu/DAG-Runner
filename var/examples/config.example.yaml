# DAG Runner master startup configuration example.
# Copy to var/config.yaml before use (dagrunner.server reads var/config.yaml by default):
#   python -m dagrunner.server --config var/config.yaml
host: 127.0.0.1
port: 7119
# SQLite is used by default. Replace with a mapping to use MySQL 8:
# db:
#   type: mysql8
#   host: 127.0.0.1
#   port: 3306
#   user: dagrunner
#   password: ""
#   database: dagrunner
#   charset: utf8mb4
#   state_dir: var
db: var/scheduler.db
logs: var/logs
threads: 8
language: zh-CN
# Optional legacy notifier.yaml path (one-time auto-import into the database on first startup).
notifier_config: null
allow_insecure_remote_login: false

# Satellite service (master side, HTTPS). Listens on a dedicated port to accept
# satellite registrations and dispatch tasks.
# Supported topologies: bidirectional -> reverse mode; master-to-satellite only -> forward mode;
# satellite-to-master only -> reverse mode. The satellite picks automatically when mode=auto.
# Master and satellite must run the exact same dagrunner.__version__; mismatches are rejected.
satellite:
  enabled: false
  host: 0.0.0.0
  port: 7120
  threads: 16
  # Master TLS certificate (auto-generated on first startup)
  cert: var/master-certs/cert.pem
  key: var/master-certs/key.pem
  # Address used by satellites to reach the master (written into downloaded satellite configs).
  # Leave blank to derive from the Web request Host + satellite.port.
  # Example: if nginx proxies https://xxx.com:7117 -> local 7120, set https://xxx.com:7117.
  # Note: port 7120 speaks HTTPS; nginx must use TLS passthrough or re-encrypt upstream.
  public_url: ""
  timeout: 15
  poll_interval: 1.0
  # Max seconds to wait for satellites to download, verify, and stage an update
  update_timeout: 300

# Software updates (git clone deployments only; release archives do not support online updates).
# Preflight checks no running tasks and clean tracked files, pulls fast-forward in place,
# updates connected satellites, and exits for the watchdog to restart.
update:
  enabled: true
  branch:
    remote: origin
    name: main

# Run history archiving. Terminal runs older than retention_days are moved to *_archive tables
# (not read by the web server; kept for troubleshooting).
maintenance:
  enabled: true
  retention_days: 60
  # Daily off-peak archive time
  hour: 3
  minute: 15
  # Runs archived per batch
  batch_size: 50

# Process watchdog. Restarts the server automatically on crash, hang, or after updates.
# Startup scripts launch python -m dagrunner.watchdog via run_tee.py; set enabled=false to run directly.
watchdog:
  enabled: true
  mode: restart                 # restart | notify (alert only, no restart)
  interval: 5                   # Health probe interval (seconds)
  timeout: 3                    # Single health probe timeout (seconds)
  alert_after: 120              # Send first alert after 2 minutes of consecutive failures
  unhealthy_after: 300          # Treat as hung and restart after 5 minutes
  backoff_base: 5               # Initial restart backoff (seconds)
  backoff_max: 300              # Maximum restart backoff (seconds)
  stable_window: 300            # Reset failure counter after staying healthy this long (seconds)
  max_consecutive_failures: 0   # 0 = retry indefinitely at backoff_max
  stop_timeout: 20              # Grace period before force-killing process tree (seconds)
  alert_to: []                  # Alert recipients; empty = log to var/logs/watchdog.log only
  alert_cooldown: 3600          # Minimum interval between repeated restart alerts (seconds)
  health:
    require_scheduler: true     # Unhealthy if scheduler is not running
    require_db: true            # Unhealthy if database is unavailable
