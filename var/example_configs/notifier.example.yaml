# Copy this file to var/notifier.yaml and fill in the SMTP account.
# Notifications are enabled and recipients are set in each workflow YAML.
email:
  host: smtp.example.com
  port: 465
  username: sender@example.com
  password: replace-with-an-app-password
  from: sender@example.com
  use_ssl: true
  starttls: false
  timeout: 10
  subject_prefix: "[DAG Runner]"
