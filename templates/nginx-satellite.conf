# DAG Runner satellite channel reverse proxy (external 7117 -> master 7120).
#
# The master's satellite service on 7120 speaks HTTPS with a self-signed
# certificate. The satellite client skips chain verification and pins the
# certificate fingerprint itself, so both variants below work.
#
# In var/config.yaml set:
#   satellite:
#     host: 127.0.0.1          # 0.0.0.0 if nginx runs on another machine
#     port: 7120
#     public_url: https://xxx.com:7117
#
# Pick ONE of the two variants.

# ---------------------------------------------------------------------------
# Variant A (recommended): SSL passthrough.
# The satellite terminates TLS with the master directly, so the fingerprint
# downloaded by the web console stays valid and host_key_policy: pinned works.
# Needs the nginx stream module; this block lives at the top level, not inside
# http {}.
# ---------------------------------------------------------------------------
stream {
    server {
        listen 7117;
        proxy_pass 127.0.0.1:7120;
        proxy_connect_timeout 10s;
        proxy_timeout 1d;
    }
}

# ---------------------------------------------------------------------------
# Variant B: terminate TLS at nginx and re-encrypt to the master.
# Use this when you want a public certificate (for example Let's Encrypt) on
# 7117. The satellite then sees nginx's certificate, so use
# host_key_policy: accept-new (or put nginx's certificate fingerprint into the
# satellite's master_cert_fingerprint).
# ---------------------------------------------------------------------------
# http {
#     server {
#         listen 7117 ssl;
#         # nginx >= 1.25.1 uses "http2 on;"; older versions: listen 7117 ssl http2;
#         http2 on;
#         server_name xxx.com;
#
#         ssl_certificate     /etc/letsencrypt/live/xxx.com/fullchain.pem;
#         ssl_certificate_key /etc/letsencrypt/live/xxx.com/privkey.pem;
#
#         location / {
#             proxy_pass https://127.0.0.1:7120;
#             proxy_ssl_verify off;              # upstream uses a self-signed cert
#             proxy_ssl_protocols TLSv1.2 TLSv1.3;
#
#             proxy_http_version 1.1;
#             proxy_set_header Connection "";
#             proxy_set_header Host $host;
#             proxy_set_header X-Real-IP $remote_addr;
#             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#             proxy_set_header X-Forwarded-Proto https;
#
#             # The reverse channel carries a long-lived SSE stream: never buffer.
#             proxy_buffering off;
#             proxy_cache off;
#             proxy_request_buffering off;
#             client_max_body_size 200m;
#
#             proxy_connect_timeout 10s;
