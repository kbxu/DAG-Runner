# DAG Runner 启动配置示例。
# dagrunner.server 默认读取本文件，启动参数全部来自此文件。
# 如需使用其他配置文件，可复制为 var/config.yaml 后执行：
#   python -m dagrunner.server --config var/config.yaml
host: 127.0.0.1
port: 7119
db: var/scheduler.db
logs: var/logs
threads: 8
language: zh-CN
notifier_config: null
allow_insecure_remote_login: false

# 卫星版服务（主程序侧，HTTPS）。启用后监听独立端口，接收卫星版注册并下发任务。
# 三种网络拓扑：双向可达用反向模式；仅主程序能访问卫星用前向模式；
# 仅卫星能访问主程序用反向模式。卫星版会根据 mode 自动选择。
satellite:
  enabled: false
  host: 0.0.0.0
  port: 7120
  threads: 16
  # 首次启动自动生成自签名证书
  # 主程序侧证书（首次启动自动生成）
  cert: var/master-certs/cert.pem
  key: var/master-certs/key.pem
  # 卫星版回连主程序时使用的地址；留空则按 Web 请求的 Host 推导
  public_url: ""
  timeout: 15
  poll_interval: 1.0
