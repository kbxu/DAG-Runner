<!doctype html>
<html lang="{{ default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ 'Sign in · DAG Runner' if default_language == 'en' else '登录 · DAG Runner' }}</title>
  <link rel="icon" href="{{ url_for('static', filename='dagrunner-logo-refined.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body
  data-next-url="{{ next_url }}"
  data-allow-insecure-remote-login="{{ 'true' if allow_insecure_remote_login else 'false' }}"
  data-default-language="{{ default_language }}"
>
  <button id="languageToggle" class="login-language" type="button">EN</button>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <img src="{{ url_for('static', filename='dagrunner-logo-refined.svg') }}" alt="">
        <div>
          <p>DAG RUNNER</p>
          <h1 id="loginTitle" data-i18n>登录控制台</h1>
        </div>
      </div>
      <p class="login-intro" data-i18n>输入管理员账号继续管理工作流。</p>
      <form id="loginForm">
        <label for="username" data-i18n>账号</label>
        <input id="username" name="username" value="admin" autocomplete="username" maxlength="64" required>
        <label for="password" data-i18n>密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
        <button id="loginButton" type="submit" data-i18n>登录</button>
      </form>
      {% if allow_insecure_remote_login %}
      <p class="login-note" data-i18n>已允许通过 HTTP 从局域网登录。登录状态默认保持 36 小时，请勿将服务暴露到公网。</p>
      {% else %}
      <p class="login-note" data-i18n>登录状态默认保持 36 小时。请通过 HTTPS 访问非本机部署。</p>
      {% endif %}
    </section>
  </main>
  <script src="{{ url_for('static', filename='i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
